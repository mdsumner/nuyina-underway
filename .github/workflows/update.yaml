name: Update Underway Data

# Yearly-partitioned store on the v0.0.1 release; see
# docs/tasks/updater-improvements.md. A routine run fetches only records newer
# than latest.json, rewrites the touched year file(s), the track, voyages,
# manifest.json and (last) latest.json. The monolith nuyina_underway.parquet
# is rebuilt weekly (Sunday slot) or on request.

on:
  schedule:
    - cron: '0 */6 * * *'
    - cron: '30 3 * * 0'   # weekly: also rebuild the monolith
  workflow_dispatch:
    inputs:
      monolith:
        description: Also rebuild nuyina_underway.parquet
        type: boolean
        default: false

concurrency:
  group: underway-update
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # keepalive: re-enable this workflow so the cron never lapses

env:
  GDAL_IMAGE: ghcr.io/osgeo/gdal:ubuntu-full-3.12.1
  RELEASE_TAG: v0.0.1
  RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/v0.0.1
  WFS_BASE: https://data.aad.gov.au/geoserver/underway/ows
  WFS_GDAL: "WFS:https://data.aad.gov.au/geoserver/ows?service=wfs&version=2.0.0&request=GetCapabilities"
  LAYER: underway:nuyina_underway
  GH_TOKEN: ${{ github.token }}
  MONOLITH: ${{ github.event.schedule == '30 3 * * 0' || inputs.monolith == true }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install duckdb==2.0.0 pyarrow==26.0.0 numpy pytz

      - name: Read high-water mark
        id: state
        run: |
          mkdir -p store new out
          if curl -fsSL -o store/latest.json "$RELEASE_BASE/latest.json" &&
             curl -fsSL -o store/manifest.json "$RELEASE_BASE/manifest.json"; then
            MAX=$(jq -r .datetime store/latest.json)
            echo "mode=incremental" >> $GITHUB_OUTPUT
          elif curl -fsSL -o store/nuyina_underway.parquet "$RELEASE_BASE/nuyina_underway.parquet"; then
            # one-off bootstrap: split the existing monolith into year files
            rm -f store/latest.json store/manifest.json
            MAX=$(python -c "import duckdb; print(duckdb.sql(\"SELECT strftime(max(datetime) AT TIME ZONE 'UTC', '%Y-%m-%dT%H:%M:%SZ') FROM 'store/nuyina_underway.parquet' WHERE year(datetime) >= 2021\").fetchall()[0][0])")
            echo "mode=bootstrap" >> $GITHUB_OUTPUT
          else
            MAX=""
            echo "mode=full" >> $GITHUB_OUTPUT
          fi
          echo "Store max datetime: ${MAX:-none}"
          echo "max=$MAX" >> $GITHUB_OUTPUT

      - name: Check WFS for latest record
        id: check
        run: |
          LATEST=$(curl -sf "$WFS_BASE?service=WFS&version=2.0.0&request=GetFeature&typeName=$LAYER&count=1&sortBy=datetime+D&outputFormat=application/json" \
            | jq -r '.features[0].properties.datetime // empty' 2>/dev/null || echo "")
          MAX="${{ steps.state.outputs.max }}"
          echo "WFS latest: ${LATEST:-unavailable}; store: ${MAX:-none}"
          if [[ -z "$LATEST" ]]; then
            echo "fetch=false" >> $GITHUB_OUTPUT
          elif [[ -z "$MAX" || "$LATEST" > "$MAX" ]]; then
            echo "fetch=true" >> $GITHUB_OUTPUT
          else
            echo "No new data"
            echo "fetch=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch from WFS
        id: fetch
        if: steps.check.outputs.fetch == 'true'
        run: |
          MAX="${{ steps.state.outputs.max }}"
          WHERE=()
          [[ -n "$MAX" ]] && WHERE=(-where "datetime > '$MAX'")
          echo "Fetching ${MAX:+records after $MAX}${MAX:-full dataset}"
          docker run --rm -v "$PWD/new:/new" $GDAL_IMAGE \
            ogr2ogr -f Parquet /new/new_records.parquet "$WFS_GDAL" "$LAYER" \
            "${WHERE[@]}" -lco COMPRESSION=ZSTD
          N=$(python -c "import pyarrow.parquet as pq; print(pq.ParquetFile('new/new_records.parquet').metadata.num_rows)" 2>/dev/null || echo 0)
          echo "Fetched $N records"
          echo "rows=$N" >> $GITHUB_OUTPUT

      - name: Merge into year files
        id: merge
        if: steps.fetch.outputs.rows > 0 || (steps.state.outputs.mode == 'bootstrap' && steps.fetch.outcome != 'failure')
        run: |
          set -e
          NEW=()
          [[ -s new/new_records.parquet ]] && NEW=(--new new/new_records.parquet)
          case "${{ steps.state.outputs.mode }}" in
            incremental)
              BASE=()
              for k in $(python scripts/build_store.py keys new/new_records.parquet); do
                f="nuyina_underway_$k.parquet"
                if jq -e --arg f "$f" '.files[$f]' store/manifest.json > /dev/null; then
                  curl -fsSL -o "store/$f" "$RELEASE_BASE/$f"
                  BASE+=("store/$f")
                fi
              done
              curl -fsSL -o store/nuyina_track.parquet "$RELEASE_BASE/nuyina_track.parquet"
              python scripts/build_store.py merge --out out "${NEW[@]}" \
                --base "${BASE[@]}" --manifest store/manifest.json --track store/nuyina_track.parquet
              ;;
            bootstrap)
              python scripts/build_store.py merge --out out --all \
                --base store/nuyina_underway.parquet "${NEW[@]}"
              echo "MONOLITH=true" >> $GITHUB_ENV
              ;;
            full)
              python scripts/build_store.py merge --out out --all --base new/new_records.parquet
              echo "MONOLITH=true" >> $GITHUB_ENV
              ;;
          esac
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Detect voyages
        if: steps.merge.outputs.status == 'success'
        run: python scripts/detect_voyages.py out/nuyina_track.parquet out

      - name: Rebuild monolith
        id: monolith
        if: env.MONOLITH == 'true' && steps.merge.outcome != 'failure'
        run: |
          set -e
          M=out/manifest.json
          [[ -f $M ]] || { M=store/manifest.json; [[ -f $M ]] || curl -fsSL -o $M "$RELEASE_BASE/manifest.json"; }
          # untouched year files go to mono/, so they are not re-uploaded
          mkdir -p mono
          FILES=()
          for f in $(jq -r '.files | keys[]' $M); do
            if [[ -f "out/$f" ]]; then FILES+=("out/$f"); else
              curl -fsSL -o "mono/$f" "$RELEASE_BASE/$f"; FILES+=("mono/$f"); fi
          done
          python scripts/build_store.py monolith --out out/nuyina_underway.parquet "${FILES[@]}"
          WANT=$(jq .rows $M)
          GOT=$(python -c "import pyarrow.parquet as pq; print(pq.ParquetFile('out/nuyina_underway.parquet').metadata.num_rows)")
          [[ "$WANT" == "$GOT" ]] || { echo "Monolith rows $GOT != manifest $WANT"; exit 1; }
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload to release
        if: steps.merge.outputs.status == 'success' || steps.monolith.outputs.status == 'success'
        run: |
          set -e
          ls -la out
          # data first, the listing next, the high-water mark last
          FILES=$(ls out/nuyina_underway*.parquet out/nuyina_track.parquet \
                     out/nuyina_track_hourly.json out/voyages.parquet out/voyages_draft.json 2>/dev/null || true)
          [[ -n "$FILES" ]] && gh release upload "$RELEASE_TAG" $FILES --clobber
          if [[ "${{ steps.merge.outputs.status }}" == "success" ]]; then
            gh release upload "$RELEASE_TAG" out/manifest.json --clobber
            gh release upload "$RELEASE_TAG" out/latest.json --clobber
            cat out/latest.json
          fi

      - name: Keepalive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yaml/enable"
